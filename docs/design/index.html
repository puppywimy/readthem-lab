<!--
  READTHEM.md 디자인 가이드라인

  - 현재 front/ 의 화면을 API 없이 그대로 보여 주는 정적 프로토타입입니다.
  - 아래 <style type="text/tailwindcss"> 는 front/src/app/globals.css 의 복사본입니다. (첫 줄 @import 만 제외)
  - 마크업과 className 은 front/src/app 의 컴포넌트에서 그대로 옮겼습니다.
  - 도서·리뷰·회원은 샘플 데이터이고, 표지는 실제 표지 대신 만든 임시 이미지입니다.

<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>READTHEM.md 디자인 가이드</title>
    <meta name="description" content="개발자의 도서 리뷰 공유 플랫폼 READTHEM.md의 현재 디자인" />
    <script>
      // layout.tsx 의 themeScript 와 동일
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("readthem-theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>

:root {
  --background: #fffaf0;
  --foreground: #1f2933;
  --line: #17202a;
  --surface: #fffdf7;
  --surface-card: #ffffff;
  --surface-soft: #fff5d9;
  --surface-muted: #eef8f4;
  --surface-transparent: transparent;
  --surface-muted-hover: #dff3eb;
  --surface-hover: #e8f6ff;
  --header-background: rgb(255 253 247 / 0.82);
  --footer-background: #eef8f4;
  --accent: #0f766e;
  --accent-soft: #ccfbf1;
  --accent-warm: #facc15;
  --title-tape-yellow: rgb(250 204 21 / 0.42);
  --title-tape-mint: rgb(45 212 191 / 0.28);
  --title-tape-peach: rgb(251 146 60 / 0.28);
  --title-highlight: var(--title-tape-yellow);
  --book-skeleton: #f7f2e8;
  --book-skeleton-active: #efe4ce;
}

:root[data-theme="dark"] {
  --background: #171b22;
  --foreground: #f4f1ea;
  --line: #f4f1ea;
  --surface: #1f2630;
  --surface-card: #242d38;
  --surface-soft: #121720;
  --surface-muted: #263241;
  --surface-transparent: transparent;
  --surface-muted-hover: #314154;
  --surface-hover: #2e4054;
  --header-background: rgb(31 38 48 / 0.9);
  --footer-background: #121720;
  --accent: #5eead4;
  --accent-soft: #134e4a;
  --accent-warm: #fde68a;
  --title-tape-yellow: rgb(59 130 246 / 0.34);
  --title-tape-mint: rgb(45 110 101 / 0.48);
  --title-tape-peach: rgb(139 88 61 / 0.46);
  --title-highlight: var(--title-tape-yellow);
  --book-skeleton: #202832;
  --book-skeleton-active: #2a3542;
}

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --font-sans:
    "GangwonEducationModuche", "Apple SD Gothic Neo", "Malgun Gothic", Arial,
    Helvetica, sans-serif;
  --text-xs: 0.8125rem;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-lg: 1.1875rem;
  --text-xl: 1.3125rem;
  --text-2xl: 1.5625rem;
  --text-3xl: 1.9375rem;
}

html,
body,
button,
input,
textarea,
select {
  font-family:
    "GangwonEducationModuche", "Apple SD Gothic Neo", "Malgun Gothic", Arial,
    Helvetica, sans-serif;
}

body {
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, var(--accent-soft) 30%, transparent),
      transparent 18rem
    ),
    var(--background);
  color: var(--foreground);
  font-size: 1.0625rem;
  overflow-x: clip;
}

:root[data-theme="dark"] body {
  background: var(--background);
}

h1,
h2 {
  display: inline-block;
  position: relative;
  z-index: 0;
  width: fit-content;
  max-width: 100%;
}

h1 {
  --title-tape: var(--title-tape-yellow);
}

h2 {
  --title-tape: var(--title-tape-mint);
}

.main-section-heading {
  display: inline-flex;
  width: fit-content;
  max-width: 100%;
  align-items: center;
  gap: 0.375rem;
  white-space: nowrap;
}

.main-section-heading svg {
  display: inline-block;
  flex: 0 0 auto;
}

h1::before,
h2::before {
  position: absolute;
  inset: 0.06em -0.18em 0.04em;
  z-index: -1;
  display: block;
  border-radius: 0.08em;
  background: var(--title-tape);
  clip-path: polygon(1.5% 7%, 98.5% 0, 100% 88%, 0 100%);
  content: "";
  opacity: 0.82;
  transform: rotate(-0.45deg);
  transform-origin: center;
}

a,
button,
input,
textarea {
  transition: transform 160ms ease;
}

a:hover {
  transform: translateY(-1px);
}

button:hover {
  transform: none;
}

.theme-site-header {
  position: relative;
  z-index: 60;
  isolation: isolate;
  background: var(--header-background);
  backdrop-filter: blur(10px);
}

.theme-site-footer {
  position: relative;
  z-index: 60;
  isolation: isolate;
  background: var(--footer-background);
}

.theme-rough-divider-bar {
  position: relative;
  left: 50%;
  z-index: 100;
  height: 12px;
  width: 100vw;
  flex: 0 0 12px;
  overflow: visible;
  pointer-events: none;
  transform: translateX(-50%);
}

.theme-rough-divider-bar svg {
  position: relative;
  z-index: 100;
  display: block;
  height: 100%;
  width: 100%;
}

.sketch-shell {
  position: relative;
  border: 1px solid color-mix(in srgb, var(--line) 22%, transparent);
  border-radius: 12px;
  background: var(--surface);
}

.sketch-card {
  position: relative;
  border: 1px solid color-mix(in srgb, var(--line) 18%, transparent);
  border-radius: 10px;
  background: var(--surface);
}

.sketch-panel {
  position: relative;
  border: 1px solid color-mix(in srgb, var(--line) 18%, transparent);
  border-radius: 10px;
  background: var(--surface);
}

.sketch-input {
  border: 1px solid color-mix(in srgb, var(--line) 28%, transparent);
  border-radius: 8px;
  background: var(--surface);
}

.sketch-input:focus {
  outline: none;
  border-color: var(--line);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--line) 8%, transparent);
}

.sketch-button {
  position: relative;
  border: 1px solid color-mix(in srgb, var(--line) 28%, transparent);
  border-radius: 8px;
  background: var(--surface);
}

.sketch-button:hover {
  background: var(--surface-hover);
}

.sketch-dashed {
  border-style: dashed;
}

.rough-overlay {
  pointer-events: none;
  position: absolute;
  inset: 0;
  display: block;
  width: 100%;
  height: 100%;
}

.ink-muted {
  color: rgb(107 114 128);
}

.book-cover-placeholder {
  background: var(--surface-muted);
}

.rough-border {
  position: relative;
  border-radius: 8px;
}

.rough-border > .rough-overlay {
  inset: -2px;
}

.rough-input-border {
  position: relative;
  display: block;
  box-sizing: border-box;
  height: 34px;
  width: 100%;
  border: 0;
  border-radius: 10px;
  background: var(--surface);
}

.rough-input-border > .rough-overlay {
  inset: 0;
}

.rough-input-paper {
  background: var(--surface-soft);
}

.rough-input-history {
  background: #e0f7ff;
}

.rough-input-wish {
  background: #fff0f4;
}

.rough-input-sm {
  height: 30px;
}

.rough-search-button {
  position: relative;
  box-sizing: border-box;
  height: 34px;
  min-width: 48px;
  border: 0;
  border-radius: 10px;
  background: var(--surface);
  padding: 0 0.5rem;
  font-size: 0.875rem;
}

.rough-search-button:hover {
  background: var(--surface-hover);
}

.rough-search-button-frame {
  position: absolute;
  inset: 0;
  display: block;
  border-radius: inherit;
  pointer-events: none;
}

.rough-search-button-frame > .rough-overlay {
  inset: 0;
}

.rough-github-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  background: var(--surface);
  padding: 0.35rem 0.5rem;
  white-space: nowrap;
}

.rough-github-link:hover {
  background: var(--surface-hover);
}

.rough-github-link:focus-visible {
  outline: 2px solid rgb(31 35 40 / 0.35);
  outline-offset: 2px;
}

.rough-github-link-framed {
  border: 1px solid color-mix(in srgb, var(--line) 45%, transparent);
  background: color-mix(in srgb, var(--surface) 88%, #ffffff);
  box-shadow:
    inset 0 1px 0 rgb(255 255 255 / 0.65),
    0 1px 0 rgb(17 24 39 / 0.05);
  padding: 0.45rem 0.9rem;
  min-height: 2.25rem;
}

.rough-github-link-framed:hover {
  background: color-mix(in srgb, var(--surface-hover) 82%, #ffffff);
}

.rough-github-image {
  display: block;
  width: 88px;
  height: 34px;
  object-fit: contain;
}

.rough-github-button-icon {
  display: block;
  width: 16px;
  height: 16px;
  object-fit: contain;
}

.auth-action-enter {
  animation: auth-action-fade-in 180ms ease-out;
}

@keyframes auth-action-fade-in {
  from {
    opacity: 0;
  }

  to {
    opacity: 1;
  }
}

:root[data-theme="dark"] .rough-github-image {
  filter: brightness(0) invert(1);
}

:root[data-theme="dark"] .rough-github-inline-image {
  filter: brightness(0) invert(1);
}

.rough-github-inline {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  line-height: 1;
  opacity: 0.75;
  transform: translateY(0);
  transition:
    opacity 160ms ease,
    transform 160ms ease;
}

.rough-github-inline:hover {
  opacity: 1;
  transform: translateY(-3px);
}

.rough-github-inline-image {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  vertical-align: middle;
}

.rough-input-compact {
  width: 5rem;
  flex: none;
}

.rough-textarea-border {
  position: relative;
  display: block;
  min-height: 58px;
  width: 100%;
  border: 0;
  border-radius: 10px;
  background: var(--surface);
}

.rough-textarea-border > .rough-overlay {
  inset: 0;
}

.rough-divider {
  position: relative;
  height: 10px;
  width: calc(100% + 12px);
  margin-left: -6px;
}

.rough-book-card {
  position: relative;
  overflow: hidden;
  border: 0;
  border-radius: 12px;
  background: var(--surface-card);
  box-shadow:
    0 1px 4px rgb(15 118 110 / 0.06),
    0 10px 20px rgb(15 118 110 / 0.1);
  transition:
    box-shadow 180ms ease,
    transform 180ms ease;
}

:root[data-theme="dark"] .rough-book-card {
  box-shadow:
    0 1px 5px rgb(0 0 0 / 0.18),
    0 10px 22px rgb(0 0 0 / 0.28);
}

.book-link,
.book-link:hover {
  transform: none;
}

.book-link .book-title,
.book-link .book-rating,
.book-link:hover .book-title,
.book-link:hover .book-rating {
  color: inherit;
  transform: none;
  transition: none;
}

.rough-book-card:hover {
  box-shadow:
    0 4px 10px rgb(15 118 110 / 0.12),
    0 16px 28px rgb(15 118 110 / 0.18);
  transform: translateY(-3px);
}

.rough-book-card.review-book-thumbnail:hover {
  box-shadow:
    0 1px 4px rgb(15 118 110 / 0.06),
    0 10px 20px rgb(15 118 110 / 0.1);
  transform: none;
}

:root[data-theme="dark"] .rough-book-card:hover {
  box-shadow:
    0 4px 12px rgb(0 0 0 / 0.24),
    0 16px 30px rgb(0 0 0 / 0.34);
}

:root[data-theme="dark"] .rough-book-card.review-book-thumbnail:hover {
  box-shadow:
    0 1px 5px rgb(0 0 0 / 0.18),
    0 10px 22px rgb(0 0 0 / 0.28);
}

.book-scroll-fade {
  --book-scroll-gutter: 0px;
  position: relative;
  width: 100%;
  overflow: hidden;
}

.book-scroll-fade::before,
.book-scroll-fade::after {
  pointer-events: none;
  position: absolute;
  top: 0;
  bottom: 0;
  z-index: 30;
  width: 0.35rem;
  content: "";
}

.book-scroll-fade::before {
  left: 0;
  background: linear-gradient(to right, var(--background), transparent);
}

.book-scroll-fade::after {
  right: 0;
  background: linear-gradient(to left, var(--background), transparent);
}

.book-scroll-list {
  padding-right: var(--book-scroll-gutter);
  padding-left: var(--book-scroll-gutter);
  scrollbar-width: none;
}

.book-scroll-list::-webkit-scrollbar {
  display: none;
}

.theme-section-divider-bar {
  height: 10px;
  width: 100%;
  padding-block: 2px;
  overflow: visible;
}

.theme-section-divider-bar svg {
  display: block;
  width: 100%;
}

.book-skeleton {
  background-color: var(--book-skeleton);
  animation: book-skeleton-pulse 1.4s ease-in-out infinite;
}

@keyframes book-skeleton-pulse {
  0%,
  100% {
    background-color: var(--book-skeleton);
  }

  50% {
    background-color: var(--book-skeleton-active);
  }
}

.book-title {
  display: -webkit-box;
  overflow: hidden;
  padding: 0 0.25rem;
  line-height: 1.5rem;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
}

.book-rating {
  display: block;
  height: 1.5rem;
  line-height: 1.5rem;
  padding: 0 0.25rem;
}

.book-rank-overlay {
  pointer-events: none;
  position: absolute;
  inset: 0;
  z-index: 10;
  background: linear-gradient(
    to top right,
    rgb(255 255 255 / 0.7),
    rgb(255 255 255 / 0.24) 28%,
    rgb(255 255 255 / 0.08) 48%,
    transparent 72%
  );
}

.book-rank-number {
  position: absolute;
  bottom: 0.5rem;
  left: 0.75rem;
  z-index: 20;
  color: #000000;
  font-size: 3rem;
  font-weight: 700;
  line-height: 1;
  filter: drop-shadow(0 2px 8px rgb(255 255 255 / 0.55));
}

:root[data-theme="dark"] .book-rank-overlay {
  background: linear-gradient(
    to top right,
    rgb(0 0 0 / 0.7),
    rgb(0 0 0 / 0.24) 28%,
    rgb(0 0 0 / 0.08) 48%,
    transparent 72%
  );
}

:root[data-theme="dark"] .book-rank-number {
  color: #ffffff;
  filter: drop-shadow(0 2px 8px rgb(0 0 0 / 0.55));
}

.rough-card-line {
  inset: 0;
  opacity: 0.68;
  transition: opacity 180ms ease;
}

.rough-book-cover-line {
  z-index: 2;
}

.theme-nav-button {
  border-radius: 0.5rem;
  padding: 0.5rem;
}

.theme-nav-control {
  display: inline-flex;
  box-sizing: border-box;
  height: 34px;
  min-width: 34px;
  align-items: center;
  justify-content: center;
  gap: 0.375rem;
  font-size: 1rem;
  line-height: 1.5rem;
}

.theme-nav-button:hover {
  background: var(--surface-hover);
}

.theme-dark-only {
  display: none;
}

:root[data-theme="dark"] .theme-light-only {
  display: none;
}

:root[data-theme="dark"] .theme-dark-only {
  display: block;
}

.theme-toggle-label::before {
  content: "다크";
}

:root[data-theme="dark"] .theme-toggle-label::before {
  content: "라이트";
}

.theme-nav-link {
  border-radius: 0.5rem;
  padding: 0.5rem;
}

.theme-nav-link.theme-nav-control {
  padding: 0 0.5rem;
}

.theme-nav-link:hover {
  background: var(--surface-hover);
}

.mobile-search-toggle {
  display: none;
}

.search-submit-button {
  display: inline-flex;
}

@media (width < 640px) {
  .mobile-search-toggle {
    display: inline-flex;
  }

  .search-submit-button {
    display: none;
  }

  .search-submit-button.search-submit-button-open {
    display: inline-flex;
  }

  .theme-nav-label {
    display: none;
  }
}

.theme-tag {
  color: #0f766e;
}

:root[data-theme="dark"] .theme-tag {
  color: #5eead4;
}

.theme-muted {
  color: #6b7280;
}

:root[data-theme="dark"] .theme-muted {
  color: #9ca3af;
}

.theme-description {
  color: #374151;
}

:root[data-theme="dark"] .theme-description {
  color: #e5e7eb;
}

.theme-subtle {
  color: #9ca3af;
}

:root[data-theme="dark"] .theme-subtle {
  color: #d4d4d8;
}

.theme-link {
  color: #2563eb;
}

:root[data-theme="dark"] .theme-link {
  color: #93c5fd;
}

.theme-tab {
  position: relative;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.theme-tab-active {
  display: inline-flex;
  position: relative;
  z-index: 0;
  isolation: isolate;
  color: var(--foreground);
  font-weight: 700;
}

.theme-tab-active::before {
  position: absolute;
  inset: 0.22em -0.15em 0.14em;
  z-index: -1;
  border-radius: 0.1em;
  background: var(--title-tape-peach);
  clip-path: polygon(1.5% 8%, 99% 0, 100% 88%, 0 100%);
  content: "";
  opacity: 0.9;
  transform: rotate(0.35deg);
}

.theme-tab-inactive {
  border-color: transparent;
  color: #9ca3af;
}

:root[data-theme="dark"] .theme-tab-inactive {

          svg.append(rc.polygon(starPoints(w, h), { stroke, strokeWidth: 1.15, roughness: 1.15, bowing: 1, fill, fillStyle: "solid" }));
        }
      }

      // 컴포넌트마다 있던 ResizeObserver 를 한 곳으로 모았다. 새 svg 가 DOM 에 들어오면 자동으로 그려진다.
      const resizeObserver = new ResizeObserver((entries) => {
        for (const { target } of entries) target.querySelectorAll(":scope > svg[data-rough]").forEach(draw);
      });
      new MutationObserver(() => {
        document.querySelectorAll("svg[data-rough]").forEach((svg) => resizeObserver.observe(svg.parentElement));
      }).observe(document.body, { childList: true, subtree: true });

      /* ───────── 공통 컴포넌트: front/src/app/_components ───────── */
      const icon = (name, cls = "h-4 w-4") => {
        const url = `url('data:image/svg+xml,${encodeURIComponent(ICONS[name])}') center / contain no-repeat`;
        return `<span aria-hidden="true" class="inline-block shrink-0 bg-current ${cls}" style="-webkit-mask:${url};mask:${url}"></span>`;
      };
      const frame = (kind = "card", cls = "rough-overlay") => `<svg data-rough="${kind}" aria-hidden="true" class="${cls}"></svg>`;
      const roughLine = (cls = "h-full w-full") => `<svg data-rough="line" data-inset="0" aria-hidden="true" class="${cls}" preserveAspectRatio="none"></svg>`;
      const star = (fill, cls = "rough-overlay") => `<svg data-rough="star" data-fill="${fill}" aria-hidden="true" class="${cls}"></svg>`;

      const TONES = { neutral: "rough-action-neutral", submit: "rough-action-submit", history: "rough-action-history", wish: "rough-action-wish", wishActive: "rough-action-wish-active", cancel: "rough-action-cancel" };
      const SIZES = { sm: "rough-action-sm", md: "", lg: "rough-action-lg" };

        `<button type="${type}" class="rough-action-button ${TONES[tone]} ${SIZES[size]} ${full ? "w-full" : ""} ${cls}" ${attrs}>
          <span class="rough-action-button-frame">${frame("search")}</span>
          <span class="relative z-10 inline-flex items-center justify-center gap-1.5 whitespace-nowrap">${children}</span>
        </button>`;

      const INPUT_TONES = { neutral: "", paper: "rough-input-paper", history: "rough-input-history", wish: "rough-input-wish" };
      const input = ({ tone = "neutral", size = "md", wrap = "", cls = "", attrs = "" } = {}) =>
        `<span class="rough-input-border ${{ sm: "rough-input-sm", md: "", compact: "rough-input-compact" }[size]} ${INPUT_TONES[tone]} ${wrap}">

      const ratingValue = (rating, { cls = "", starCls = "h-5 w-5" } = {}) =>

      const bookTape = (children, { overlay = true, cls = "" } = {}) =>

      const bookGridItem = (book, index, horizontal) =>

      const likeButton = (review) =>
        button(`${icon(review.liked ? "heart" : "heart-outline", "h-4 w-4 align-[-0.125em]")} 좋아요 ${review.likes}`, {

      const histogram = (cls = "") => {

          <div class="rough-rating-chart">

              .map(

                  <div class="rough-rating-bar" style="height:${(HISTOGRAM[bucket] / max) * 100}%">
                    <svg data-rough="bar" data-fill="${ratingStyle(Number(bucket)).fill}" aria-hidden="true" class="rough-overlay" preserveAspectRatio="none"></svg>
                  </div>
                </div>`,
              )
              .join("")}
          </div>
          <div class="flex justify-between text-xs text-gray-500"><span>0.5</span><span>5</span></div>
        </div>`;
      };

      const roughDivider = ({ full = false } = {}) =>
        `<svg aria-hidden="true" class="rough-list-divider ${full ? "rough-list-divider-full" : ""}" width="900" height="10" viewBox="-18 0 936 10" preserveAspectRatio="none">
          <g>
            <path d="M-18 4.3 C210 2.8, 360 6.1, 450 5 C540 3.9, 690 6.2, 918 4.7" stroke="#6b7280" stroke-width="1" fill="none" />
            <path d="M-18 5.8 C210 7.2, 360 3.9, 450 5 C540 6.1, 690 3.8, 918 5.3" stroke="#6b7280" stroke-width="0.6" fill="none" />
          </g>
        </svg>`;
      const adminDivider = () => `<div class="relative h-2 w-full opacity-70 ">${frame("softDivider")}</div>`;
      const sectionDivider = () => `<div class="theme-section-divider-bar mt-7 opacity-25">${roughLine()}</div>`;

      /* ───────── RoughRatingInput ───────── */
      const starPreview = (percent, fill) =>
        `<span class="relative inline-block h-7 w-7 shrink-0">
          ${star("#e5e7eb")}
          ${percent > 0 ? `<span class="absolute inset-y-0 left-0 overflow-hidden" style="width:${percent}%">${star(fill)}</span>` : ""}
        </span>`;
      const ratingStars = (active) => {
        const fill = active === 0 ? "#e5e7eb" : ratingStyle(active / 2).fill;
        return Array.from({ length: 5 }, (_, i) => {
          const threshold = (i + 1) * 2;
          return starPreview(active >= threshold ? 100 : active === threshold - 1 ? 50 : 0, fill);
        }).join("");
      };
      const ratingText = (value) => (value === 0 ? "미선택" : `${value / 2}점`);
      const ratingTextCls = (value) => `min-w-12 ${value === 0 ? "text-gray-600" : ratingStyle(value / 2).text}`;
      const ratingInput = (defaultValue) => {
        const value = defaultValue != null ? Math.round(defaultValue * 2) : 0;
        return `<div class="flex min-w-0 flex-col gap-2" data-rating-root data-value="${value}">
          <div class="flex flex-wrap items-center gap-2 text-sm">
            <span>평점</span>
            <span data-rating-text class="${ratingTextCls(value)}">${ratingText(value)}</span>
            <button class="text-xs text-gray-500 underline" type="button" data-act="rating-clear">선택 해제</button>
          </div>
          <div class="rough-rating-input-wrap" role="slider" aria-label="평점" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${value / 2}" aria-valuetext="${ratingText(value)}" tabindex="0">
            <div class="rough-rating-input-stars" aria-hidden="true">${ratingStars(value)}</div>
          </div>
        </div>`;

      function setRating(root, value, committed = true) {
        if (committed) root.dataset.value = value;
        const selected = Number(root.dataset.value);
        const text = root.querySelector("[data-rating-text]");
        const wrap = root.querySelector(".rough-rating-input-wrap");
        text.className = ratingTextCls(selected);
        text.textContent = ratingText(selected);
        wrap.setAttribute("aria-valuenow", selected / 2);
        wrap.setAttribute("aria-valuetext", ratingText(selected));
        wrap.firstElementChild.innerHTML = ratingStars(value);
      }
      const ratingFromPointer = (wrap, clientX) => {
        const rect = wrap.getBoundingClientRect();
        const x = Math.min(Math.max(clientX - rect.left, 0), rect.width);
        return x === 0 ? 0 : Math.min(10, Math.max(1, Math.ceil((x / rect.width) * 10)));
      };

      const WIDGET_STEPS = [

            ${open ? "" : `<button type="button" class="mobile-search-toggle theme-nav-link theme-nav-control shrink-0" data-act="search-open" aria-label="검색창 열기">${icon("search")}<span class="theme-nav-label">검색</span></button>`}

            <div class="ml-auto shrink-0 items-center justify-end gap-2 whitespace-nowrap ${open ? "hidden sm:flex" : "flex"}">
              <button type="button" class="theme-nav-link theme-nav-control shrink-0" data-act="theme" aria-label="테마 전환">
                ${icon("moon", "theme-light-only h-4 w-4")}${icon("sun", "theme-dark-only h-4 w-4")}
                <span class="theme-nav-label theme-toggle-label"></span>
              </button>
              ${
                isLogin()
                  ? `<div class="auth-action-enter flex min-w-0 items-center gap-2 whitespace-nowrap">
                      ${navLink("#/mypage", "library", "내 서재")}
                      ${state.auth === "admin" ? navLink("#/admin", "admin", "관리자") : ""}
                      <button type="button" class="theme-nav-link theme-nav-control" data-act="logout" aria-label="로그아웃">${icon("logout")}<span class="theme-nav-label">로그아웃</span></button>
                    </div>`
                  : `<div class="auth-action-enter">
                      <a href="#" class="theme-nav-link theme-nav-control gap-1.5" data-act="login" aria-label="GitHub로 로그인">${icon("github")}<span class="theme-nav-label">GitHub로 로그인</span></a>
                    </div>`
              }
            </div>
          </nav>
          <div class="theme-rough-divider-bar">${roughLine()}</div>
        </header>`;
      }

      /* ───────── 화면: 홈 (app/page.tsx) ───────── */
      function homeScreen() {
        const horizontal = "book-scroll-list flex snap-x snap-mandatory gap-5 overflow-x-auto py-2 pb-4";
        const bookSection = (title, iconName, books, cls) =>
          `<section class="${cls}">
            ${sectionHead(title, iconName)}
            <div class="book-scroll-fade">
              <ul class="${horizontal}">
                ${books
                  .map(
                    (book, i) => `<li class="book-horizontal-item group flex shrink-0 flex-col basis-[calc((100%_-_2.5rem)/3)] md:basis-[calc((100%_-_3.75rem)/4)] xl:basis-[calc((100%_-_5rem)/5)] relative ${i === books.length - 1 ? "snap-end" : "snap-start"}" data-carousel-item>
                      ${bookGridItem(book, i, true)}
                    </li>`,
                  )
                  .join("")}
              </ul>
            </div>
          </section>`;
        const reviews = [...REVIEWS].sort((a, b) => b.likes - a.likes);
        const popularReviews = `<section class="mt-6">
          ${sectionHead("인기 많은 리뷰", "fire")}
          <div class="book-scroll-fade">
            <ul data-step="review" class="book-scroll-list flex snap-x snap-mandatory gap-4 overflow-x-auto py-2 pb-4">
              ${reviews
                .map(
                  (review, i) => `<li class="min-w-0 basis-full shrink-0 xl:basis-[calc((100%_-_1rem)/2)] ${i === reviews.length - 1 ? "snap-end" : "snap-start"}" data-carousel-item>
                    ${likedReviewCard(review)}
                  </li>`,
                )
                .join("")}
            </ul>
          </div>
        </section>`;
        const latest = [...BOOKS.slice(0, 9), ...BOOKS.slice(0, 3)];
        const latestReviews = `<section class="mt-6">
          ${sectionHead("최근 리뷰가 추가된 도서", "clock")}
          <div class="book-scroll-fade">
            <ul data-step="latest" class="book-scroll-list flex snap-x snap-mandatory gap-3 overflow-x-auto py-2 pb-4">
              ${latest
                .map(
                  (book, i) => `<li class="basis-[calc((100%_-_3rem)/5)] shrink-0 sm:basis-[calc((100%_-_3.75rem)/6)] lg:basis-[calc((100%_-_4.5rem)/7)] xl:basis-[calc((100%_-_5.25rem)/8)] ${i === latest.length - 1 ? "snap-end" : "snap-start"}" data-carousel-item>
                    <article class="relative h-full w-full overflow-hidden rounded-xl bg-white">
                      ${bookCoverCard(
                        book,
                        bookTape(`<div class="flex flex-col gap-1">
                          <div class="line-clamp-1 text-xs font-bold">${esc(book.title)}</div>
                          <span class="text-xs font-bold">${ratingValue(book.rating)}</span>
                        </div>`),
                      )}
                    </article>
                  </li>`,
                )
                .join("")}
            </ul>
          </div>
        </section>`;
        const byRating = [...BOOKS].sort((a, b) => b.rating - a.rating);
        const byReviews = [...BOOKS].sort((a, b) => b.reviewCount - a.reviewCount);
        return [
          bookSection("인기 도서", "fire", BOOKS, "mt-4"),
          popularReviews,
          latestReviews,
          bookSection("평점 좋은 도서", "star", byRating, "mt-6"),
          bookSection("리뷰 많은 도서", "stacked-books", byReviews, "mt-6"),
        ].join(sectionDivider());
      }

      /* ───────── 화면: 검색 (app/books/search/page.tsx) ───────── */
      function searchScreen(params) {
        const term = params.get("term") || "코드";
        return `<h1>'${esc(term)}' 검색 결과</h1>
          ${bookGrid(BOOKS)}
          <div class="py-6 text-center text-sm theme-muted">마지막 검색 결과입니다.</div>`;
      }

      /* ───────── 화면: 도서 상세 (app/books/detail/page.tsx) ───────── */
      function bookScreen(params) {
        const book = bookOf(Number(params.get("id"))) ?? BOOKS[1];
        const reviews = REVIEWS.filter((r) => r.bookId === book.id);
        const wished = isLogin() && state.wished.has(book.id);
        const recommended = BOOKS.filter((b) => b.id !== book.id);
        return `<div class="flex flex-col gap-6 p-4 max-w-3xl mx-auto w-full">
          <div class="flex gap-6">
            <div class="flex w-40 shrink-0 flex-col gap-2">
              <div class="rough-cover flex h-56 items-center justify-center overflow-hidden ${book.noCover ? "book-cover-placeholder" : ""}">
                ${frame("card")}
                ${thumbnail(book, "w-full h-full object-cover", "flex h-full w-full items-center justify-center text-sm text-gray-400", "text-sm text-gray-400")}
              </div>
              ${wishButton(book, wished)}
            </div>
            <div class="grid flex-1 gap-4 md:grid-cols-[minmax(0,1fr)_10rem]">
              <div class="flex min-w-0 flex-col gap-2">
                <h1 class="text-2xl font-bold">${esc(book.title)}</h1>
                <div class="text-sm theme-muted">${book.authors.map(esc).join(", ")} · ${esc(book.publisher)} · ${book.date}</div>
                <p class="mt-1 text-sm theme-description">${DESCRIPTION}</p>
                ${tagList(book.tags, "flex flex-wrap gap-2 text-sm theme-tag")}
              </div>
              <div class="flex min-w-0 flex-col gap-2">
                <div class="text-right">
                  <div class="text-4xl font-bold leading-none ${ratingStyle(book.rating).text}">${ratingValue(book.rating, { starCls: "h-9 w-9" })}</div>
                  <div class="mt-1 text-sm theme-muted">리뷰 ${book.reviewCount}개</div>
                </div>
                ${histogram("mt-1 w-full max-w-40")}
              </div>
            </div>
          </div>
          ${
            isLogin()
              ? `<div>
                  <div class="flex h-8 items-center gap-2">
                    <h2 class="text-lg font-bold">추천 도서</h2>
                    <span class="text-sm theme-muted">${recommended.length}권</span>
                    ${carouselButtons("추천 도서")}
                  </div>
                  <ul class="book-scroll-list mt-3 flex gap-3 overflow-x-auto py-2 pb-4">
                    ${recommended
                      .map(
                        (b) => `<li class="shrink-0" data-carousel-item>
                          <article class="relative h-full w-24 overflow-hidden rounded-xl bg-white">
                            ${bookCoverCard(
                              b,
                              bookTape(`<div class="flex flex-col gap-1">
                                <div class="truncate text-xs font-bold">${esc(b.title)}</div>
                                <div class="flex items-center gap-1 text-xs font-bold">
                                  <span class="relative inline-block h-3.5 w-3.5 shrink-0">${star(ratingStyle(b.rating).fill)}</span>
                                  <span>${b.rating.toFixed(1)}</span>
                                </div>
                              </div>`),
                            )}
                          </article>
                        </li>`,
                      )
                      .join("")}
                  </ul>
                </div>`
              : ""
          }
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h2 class="text-lg font-bold">리뷰 ${reviews.length}개</h2>
              ${button(`${icon("review", "h-4 w-4 align-[-0.125em]")} 리뷰 작성하기`, { size: "sm", tone: "history", attrs: `data-act="write-review" data-book-id="${book.id}"` })}
            </div>
            ${reviews.length === 0 ? '<div class="mt-2 text-sm theme-muted">아직 리뷰가 없습니다.</div>' : ""}
            <ul class="mt-2 flex w-full flex-col">
              ${reviews.map((review, i) => `<li class="relative py-3">${reviewDetailCard(review, { actions: true })}${i < reviews.length - 1 ? roughDivider() : ""}</li>`).join("")}
            </ul>
          </div>
        </div>`;
      }
      const wishButton = (book, wished) =>
        button(`${icon(wished ? "bookmark" : "bookmark-outline", "h-4 w-4 align-[-0.125em]")} ${wished ? "보고 싶어요 취소" : "보고 싶어요"}`, {
          full: true,
          size: "sm",
          tone: wished ? "wishActive" : "wish",
          attrs: `data-act="wish" data-id="${book.id}"`,
        });

      /* ───────── 화면: 내 서재·회원 서재 (app/mypage, app/members/detail) ───────── */
      const widgetPreview = ({ withLink }) =>
        `<div class="min-w-0 w-full">
          <div class="flex min-w-0 items-center justify-between gap-2">
            <h2 class="font-bold">위젯 미리보기</h2>
            ${
              withLink
                ? `<div class="flex flex-wrap justify-end gap-2">
                    ${button('<span data-copy-label>코드 복사</span>', { size: "sm", tone: "history", attrs: 'data-act="copy-widget"' })}
                    ${button("README 가이드 보기", { size: "sm", attrs: 'data-act="widget-step" data-step="1"' })}
                  </div>`
                : ""
            }
          </div>
          <div class="rough-panel-border relative mt-1 flex min-h-24 items-center justify-center bg-transparent p-2">
            ${frame("card")}
            <img class="max-w-full" src="widget-sample.svg" alt="위젯 미리보기" />
          </div>
          ${withLink ? `<div class="mt-1">${input({ size: "sm", cls: "text-xs", attrs: `readonly value="${WIDGET_LINK}"` })}</div>` : ""}
        </div>`;

      const profilePanel = ({ username, githubId, averageLabel, mobileWidget, actions = "" }) =>
        `<aside class="flex w-48 shrink-0 flex-col items-center gap-1 pt-6 max-sm:w-full max-sm:items-stretch">
          <div class="flex w-full flex-col items-center gap-3 max-sm:flex-row max-sm:items-center max-sm:justify-start">
            ${avatar(githubId, "lg")}
            <div class="min-w-0 text-center max-sm:min-w-0 max-sm:flex-1 max-sm:text-left">
              <div class="text-sm">아이디 : ${esc(username)}</div>
              <div class="text-sm">닉네임 : ${esc(githubId)}</div>
              <a class="theme-link text-sm underline" href="#" data-act="noop">github 주소</a>
              <div class="mt-3 flex w-full justify-start max-sm:w-auto">${actions}</div>
            </div>
          </div>
          <div class="mt-8 hidden w-full max-sm:block"><div class="max-sm:block sm:hidden">${mobileWidget}</div></div>
          <div class="mt-2 flex w-full flex-col gap-3 max-sm:flex-row max-sm:items-start">
            <div class="flex min-w-0 flex-1 flex-col gap-1">
              <div class="text-xs theme-muted">${averageLabel}</div>
              <div class="text-lg font-bold ${ratingStyle(3.8).text}">${ratingValue(3.8)}</div>
            </div>
            <div class="min-w-0 flex-1">${histogram("mt-0 w-full")}</div>
          </div>
        </aside>`;

      const libraryLayout = (sidebar, children) =>
        `<div class="flex flex-col gap-4 sm:flex-row sm:gap-8">
          ${sidebar}
          <div class="flex min-w-0 flex-1 flex-col gap-4 max-sm:gap-1">${children}</div>
        </div>`;

      const libraryReviewItem = (review, last, withActions) => {
        const book = bookOf(review.bookId);
        const rating = `<span class="font-bold ${withActions ? "" : "shrink-0"} ${ratingStyle(review.rating).text}">${ratingValue(review.rating)}</span>`;
        return `<li class="relative flex items-start gap-3 py-3">
          ${last ? "" : roughDivider({ full: true })}
          <a href="${bookHref(book.id)}" class="rough-book-card review-book-thumbnail relative flex h-20 w-14 shrink-0 items-center justify-center overflow-hidden rounded-lg bg-white" aria-label="${esc(book.title)} 상세 보기">
            ${frame("card", "rough-overlay rough-card-line rough-book-cover-line")}
            ${thumbnail(book, "h-full w-full object-cover")}
          </a>
          <div class="flex-1 min-w-0">
            <a class="font-semibold hover:underline" href="${bookHref(book.id)}">${esc(book.title)}</a>
            ${tagList(review.tags)}
            <div class="mt-1 text-sm">${esc(review.content)}</div>
            <div class="mt-1 text-xs theme-subtle">${review.at}</div>
          </div>
          ${
            withActions
              ? `<div class="flex shrink-0 flex-col items-end gap-2">
                  ${rating}
                  <div class="flex flex-wrap items-center justify-end gap-2">
                    ${button("수정", { size: "sm", cls: "px-2", attrs: `data-act="edit-review" data-id="${review.id}"` })}
                    ${button("삭제", { size: "sm", tone: "cancel", cls: "px-2", attrs: `data-act="delete-review" data-id="${review.id}"` })}
                  </div>
                </div>`
              : rating
          }
        </li>`;
      };

      function mypageScreen() {
        const mine = REVIEWS.filter((r) => r.reviewer.id === ME.id);
        const liked = REVIEWS.filter((r) => r.liked);
        const tab = (value, label) =>
          `<div class="theme-tab"><button type="button" class="px-3 py-2 text-sm ${state.mypageTab === value ? "theme-tab-active" : "theme-tab-inactive"}" data-act="mypage-tab" data-tab="${value}">${label}</button></div>`;
        const panels = {
          reviews: () =>
            `${mine.length === 0 ? '<div class="text-sm theme-muted">작성한 리뷰가 없습니다.</div>' : ""}
            <ul class="flex w-full flex-col">${mine.map((r, i) => libraryReviewItem(r, i === mine.length - 1, true)).join("")}</ul>`,
          liked: () =>
            `${liked.length === 0 ? '<div class="text-sm theme-muted">좋아요한 리뷰가 없습니다.</div>' : ""}
            <ul class="flex w-full flex-col">
              ${liked
                .map((review, i) => {
                  const book = bookOf(review.bookId);
                  return `<li class="relative py-3">
                    ${i < liked.length - 1 ? roughDivider({ full: true }) : ""}
                    <div class="flex gap-3">
                      <div class="relative w-24 shrink-0">
                        <a href="${bookHref(book.id)}" class="rough-book-card review-book-thumbnail relative flex h-36 w-24 items-center justify-center overflow-hidden rounded-lg bg-white" aria-label="${esc(book.title)} 상세 보기">
                          ${frame("card", "rough-overlay rough-card-line rough-book-cover-line")}
                          ${thumbnail(book, "h-full w-full object-cover")}
                          ${bookTape(`<div class="flex flex-col gap-1"><div class="line-clamp-1 text-xs font-bold">${esc(book.title)}</div></div>`)}
                        </a>
                      </div>
                      <div class="min-w-0 flex-1">${reviewDetailCard(review, { actions: true })}</div>
                    </div>
                  </li>`;
                })
                .join("")}
            </ul>`,
          wishes: () =>
            `${WISHES.length === 0 ? '<div class="text-sm theme-muted">보고 싶어요 한 도서가 없습니다.</div>' : ""}
            <ul class="flex w-full flex-col">
              ${WISHES.map(
                (book, i) => `<li class="relative flex items-center justify-between gap-3 py-3">
                  ${i < WISHES.length - 1 ? roughDivider({ full: true }) : ""}
                  <a href="${bookHref(book.id)}" class="font-semibold">${esc(book.title)}</a>
                  <div class="flex items-center gap-3">
                    <span class="font-bold ${ratingStyle(book.rating).text}">${ratingValue(book.rating)}</span>
                    ${button(`${icon("bookmark", "h-4 w-4 align-[-0.125em]")} 보고 싶어요 취소`, { size: "sm", tone: "wishActive", cls: "px-2", attrs: `data-act="remove-wish" data-id="${book.id}"` })}
                  </div>
                </li>`,
              ).join("")}
            </ul>`,
        };
        return libraryLayout(
          profilePanel({
            username: ME.username,
            githubId: ME.githubId,
            averageLabel: "내가 준 평균 별점",
            mobileWidget: widgetPreview({ withLink: true }),
            actions: `<div class="mt-4 flex w-full gap-2 max-sm:w-auto max-sm:flex-wrap">
              ${button("로그아웃", { size: "sm", cls: "flex-1 max-sm:flex-none", attrs: 'data-act="logout"' })}
              ${button("회원 탈퇴", { size: "sm", tone: "cancel", cls: "flex-1 max-sm:flex-none", attrs: 'data-act="withdraw"' })}
            </div>`,
          }),
          `<div class="max-sm:hidden">${widgetPreview({ withLink: true })}</div>
          <section class="flex flex-col gap-1">
            <div class="flex gap-2">
              ${tab("reviews", `작성한 리뷰 ${mine.length}`)}
              ${tab("liked", `좋아요한 리뷰 ${liked.length}`)}
              ${tab("wishes", `보고 싶어요 ${WISHES.length}`)}
            </div>
            ${panels[state.mypageTab]()}
          </section>`,
        );
      }

      function memberScreen() {
        const reviews = REVIEWS.filter((r) => r.reviewer.githubId === "book-lover");
        return libraryLayout(
          profilePanel({ username: "book-lover", githubId: "book-lover", averageLabel: "평균 별점", mobileWidget: widgetPreview({ withLink: false }) }),
          `<div class="max-sm:hidden">${widgetPreview({ withLink: false })}</div>
          <div>
            <div class="flex gap-2"><div class="theme-tab"><div class="theme-tab-active px-3 py-2 text-sm">작성한 리뷰 ${reviews.length}</div></div></div>
            <ul class="flex w-full flex-col">${reviews.map((r, i) => libraryReviewItem(r, i === reviews.length - 1, false)).join("")}</ul>
          </div>`,
        );
      }

      /* ───────── 화면: 관리자 (app/admin) ───────── */
      const adminPager = () =>
        `<div class="flex items-center gap-2">
          ${button("이전", { size: "sm", attrs: "disabled" })}
          <span class="text-sm">1 / 1</span>
          ${button("다음", { size: "sm", attrs: "disabled" })}
        </div>`;
      const adminTable = (heads, rows) =>
        `<div class="flex flex-col gap-4">
          <div class="overflow-x-auto">
            ${adminDivider()}
            <table class="w-full text-left text-sm">
              <thead>
                <tr>${heads.map((h) => `<th class="p-2">${h}</th>`).join("")}</tr>
                <tr aria-hidden="true"><td colspan="${heads.length}" class="p-0">${adminDivider()}</td></tr>
              </thead>
              <tbody>${rows.join(`<tr aria-hidden="true"><td colspan="${heads.length}" class="p-0">${adminDivider()}</td></tr>`)}</tbody>
            </table>
            ${adminDivider()}
          </div>
          ${adminPager()}
        </div>`;
      const ADMIN_MEMBERS = [
        { id: 1, username: "admin", nickname: "관리자", githubId: "readthem-admin", admin: true, deleted: false, date: "2026-01-02" },
        { id: 2, username: "readthem", nickname: "리드뎀", githubId: "readthem-dev", admin: false, deleted: false, date: "2026-03-14" },
        { id: 3, username: "booklover", nickname: "책벌레", githubId: "book-lover", admin: false, deleted: false, date: "2026-05-21" },
        { id: 4, username: "left-user", nickname: "떠난회원", githubId: "left-user", admin: false, deleted: true, date: "2026-06-30" },
      ];
      const adminBookForm = (b) =>
        `<form class="sketch-panel flex max-w-md flex-col gap-2 p-3" data-admin-book-form>
          <h2 class="font-bold">도서 정보 수정 (#${b.id})</h2>
          ${input({ attrs: `type="text" placeholder="제목" value="${esc(b.title)}"` })}
          ${textarea({ value: DESCRIPTION, attrs: 'placeholder="설명" rows="3"' })}
          ${input({ attrs: `type="text" placeholder="저자 (쉼표로 구분)" value="${esc(b.authors.join(", "))}"` })}
          ${input({ attrs: `type="text" placeholder="출판사" value="${esc(b.publisher)}"` })}
          ${input({ attrs: 'type="text" placeholder="표지 이미지 URL"' })}
          <div class="flex gap-2">
            ${button("저장", { tone: "submit", type: "submit" })}
            ${button("취소", { tone: "cancel", attrs: 'data-act="admin-edit"' })}
          </div>
        </form>`;
      const adminPanels = {
        members: () =>
          adminTable(
            ["ID", "아이디", "닉네임", "GitHub", "권한", "상태", "가입일", ""],
            ADMIN_MEMBERS.map(
              (m) => `<tr>
                <td class="p-2">${m.id}</td><td class="p-2">${m.username}</td><td class="p-2">${m.nickname}</td><td class="p-2">${m.githubId}</td>
                <td class="p-2">${m.admin ? "관리자" : "일반"}</td>
                <td class="p-2 theme-muted">${m.deleted ? "탈퇴" : "정상"}</td>
                <td class="p-2 theme-subtle">${m.date}</td>
                <td class="p-2">${!m.admin && !m.deleted ? button("강제 탈퇴", { size: "sm", tone: "cancel", attrs: 'data-act="toast" data-msg="회원을 강제 탈퇴했습니다."' }) : ""}</td>
              </tr>`,
            ),
          ),
        books: () =>
          adminTable(
            ["ID", "제목", "평점", ""],
            BOOKS.slice(0, 5).map(
              (b) => `<tr>
                <td class="p-2">${b.id}</td><td class="p-2">${esc(b.title)}</td><td class="p-2">${b.rating}</td>
                <td class="flex gap-2 p-2">
                  ${button("수정", { size: "sm", attrs: `data-act="admin-edit" data-id="${b.id}"` })}
                  ${button("삭제", { size: "sm", tone: "cancel", attrs: 'data-act="toast" data-msg="도서를 삭제했습니다."' })}
                </td>
              </tr>`,
            ),
          ),
        reviews: () =>
          `<div class="flex flex-col gap-4">
            <ul class="flex flex-col">

      const ACTIONS = {

        logout() {
          setAuth("guest");
          showToast("로그아웃되었습니다.");
          if (currentRoute().path === "mypage") location.hash = "#/";
        },
        withdraw() {
          if (!confirm("정말 탈퇴하시겠습니까? 되돌릴 수 없습니다.")) return;
          setAuth("guest");
          showToast("회원 탈퇴가 완료되었습니다.");

        "search-open"() {

        carousel(el) {
          const next = el.parentElement.parentElement.nextElementSibling;
          const list = next.matches("ul") ? next : next.querySelector("ul");
          const items = list.querySelectorAll("[data-carousel-item]");
          const distance = items[1].offsetLeft - items[0].offsetLeft;
          const step =
            list.dataset.step === "latest"
              ? matchMedia("(min-width: 640px)").matches ? 3 : 1
              : list.dataset.step === "review" && distance * 2 > list.clientWidth ? 1 : 2;
          const max = list.scrollWidth - list.clientWidth;
          list.scrollTo({ left: Math.min(max, Math.max(0, list.scrollLeft + distance * step * Number(el.dataset.dir))), behavior: "smooth" });
        },
        wish(el) {
          if (!isLogin()) return openModal(loginModal());
          const id = Number(el.dataset.id);
          const wished = !state.wished.has(id);

          if (!isLogin()) return openModal(loginModal());
          const review = REVIEWS.find((r) => r.id === Number(el.dataset.id));
          review.liked = !review.liked;
          review.likes += review.liked ? 1 : -1;
          showToast(review.liked ? "좋아요를 눌렀습니다." : "좋아요를 취소했습니다.");
          el.outerHTML = likeButton(review);
        },
        "write-review"(el) {
          if (!isLogin() && !("force" in el.dataset)) return openModal(loginModal());
          openModal(reviewModal({ title: "리뷰 작성", submitLabel: "리뷰 작성", bookId: el.dataset.bookId }));
        },
        "edit-review"(el) {
          const review = REVIEWS.find((r) => r.id === Number(el.dataset.id));
          openModal(reviewModal({ title: "리뷰 수정", submitLabel: currentRoute().path === "mypage" ? "수정 완료" : "리뷰 수정", review }));
        },
        "delete-review"(el) {
          if (!confirm("리뷰를 삭제하시겠습니까?")) return;
          REVIEWS = REVIEWS.filter((r) => r.id !== Number(el.dataset.id));
          showToast("리뷰를 삭제했습니다.");
          render();
        },
        "remove-wish"(el) {
          WISHES = WISHES.filter((b) => b.id !== Number(el.dataset.id));
          showToast("보고 싶어요를 취소했습니다.");
          render();
        },
        "mypage-tab"(el) {
          state.mypageTab = el.dataset.tab;
          render();
        },
        "admin-tab"(el) {
          state.adminTab = el.dataset.tab;
          render();
        },
        "admin-edit"(el) {
          state.adminEditId = Number(el.dataset.id) || null;
          render();
        },
        "login-modal"() {
          openModal(loginModal());
        },
        "modal-close": closeModal,
        "widget-step"(el) {
          openModal(widgetGuideModal(Number(el.dataset.step)));
        },
        "copy-widget"() {
          navigator.clipboard?.writeText(widgetCode).catch(() => {});
          const labels = () => document.querySelectorAll("[data-copy-label]");
          labels().forEach((label) => (label.textContent = "복사 완료"));
          setTimeout(() => labels().forEach((label) => (label.textContent = "코드 복사")), 2000);
        },
        "rating-clear"(el) {
          setRating(el.closest("[data-rating-root]"), 0);
        },
        toast(el) {
          showToast(el.dataset.msg);
        },
        back() {
          history.back();
        },
      };

      document.addEventListener("click", (e) => {
        const el = e.target.closest("[data-act]");
        if (!el) return;
        if (el.tagName === "A") e.preventDefault();
        ACTIONS[el.dataset.act](el);
      });
      document.addEventListener("change", (e) => {
        if (e.target.matches("[data-auth-select]")) setAuth(e.target.value);
      });
      document.addEventListener("input", (e) => {
        if (e.target.closest("[data-search-form]")) state.searchTerm = e.target.value;
      });
      document.addEventListener("submit", (e) => {
        e.preventDefault();
        const form = e.target;
        if (form.matches("[data-search-form]")) {
          const term = state.searchTerm.trim();
          if (term.length < 2) return showToast("검색어는 2글자 이상 입력해주세요.");
          state.searchOpen = false;
          location.hash = `#/search?term=${encodeURIComponent(term)}`;
        } else if (form.matches("[data-review-form]")) {
          const value = Number(form.querySelector("[data-rating-root]").dataset.value);
          if (value === 0) return showToast("평점을 선택해주세요.");
          const fields = {
            rating: value / 2,
            content: form.elements.content.value.trim(),
            tags: form.elements.tags.value.split(",").map((t) => t.trim()).filter(Boolean),
          };
          const review = REVIEWS.find((r) => r.id === Number(form.dataset.id));
          if (review) Object.assign(review, fields);
          else REVIEWS.unshift({ id: Date.now(), bookId: Number(form.dataset.bookId), reviewer: ME, likes: 0, liked: false, at: "2026-11-04 12:00", ...fields });
          showToast(review ? "리뷰를 수정했습니다." : "리뷰를 작성했습니다.");
          closeModal();
          render();
        } else if (form.matches("[data-admin-book-form]")) {
          state.adminEditId = null;
          showToast("도서 정보를 수정했습니다.");
          render();
        } else if (form.matches("[data-admin-login]")) {
          setAuth("admin");
        } else if (form.matches("[data-account-form]")) {
          setAuth("member");
          location.hash = "#/";
        }
      });
      // 모바일 검색: 포커스를 잃으면 접고, 제출 버튼은 포커스를 잃기 전에 제출한다
      document.addEventListener("focusout", (e) => {
        const form = e.target.closest?.("[data-search-form]");
        if (!form || !state.searchOpen || form.contains(e.relatedTarget) || !matchMedia("(max-width: 639px)").matches) return;
        state.searchOpen = false;
        renderHeader();
      });
      document.addEventListener("pointerdown", (e) => {
        const submit = e.target.closest?.(".search-submit-button");
        if (submit && matchMedia("(max-width: 639px)").matches) {
          e.preventDefault();
          submit.form.requestSubmit();
          return;
        }
        const wrap = e.target.closest?.(".rough-rating-input-wrap");
        if (!wrap) return;
        e.preventDefault();
        wrap.dataset.dragging = "";
        setRating(wrap.closest("[data-rating-root]"), ratingFromPointer(wrap, e.clientX));
      });
      document.addEventListener("pointermove", (e) => {
        const wrap = e.target.closest?.(".rough-rating-input-wrap[data-dragging]");
        if (wrap) setRating(wrap.closest("[data-rating-root]"), ratingFromPointer(wrap, e.clientX));
      });
      document.addEventListener("pointerup", () => {
        document.querySelectorAll("[data-dragging]").forEach((wrap) => delete wrap.dataset.dragging);
      });
      document.addEventListener("keydown", (e) => {
        const wrap = e.target.closest?.(".rough-rating-input-wrap");
        if (!wrap) return;
        const root = wrap.closest("[data-rating-root]");
        const value = Number(root.dataset.value);
        if (e.key === "ArrowRight" || e.key === "ArrowUp") setRating(root, Math.min(10, value + 1));
        else if (e.key === "ArrowLeft" || e.key === "ArrowDown") setRating(root, Math.max(0, value - 1));
        else if (e.key === "Backspace" || e.key === "Delete") setRating(root, 0);
        else return;
        e.preventDefault();
      });
      document.addEventListener("focusin", (e) => {
        if (e.target.matches?.("input[readonly]")) e.target.select();
      });
      addEventListener("hashchange", () => {
        closeModal();
        render();
        scrollTo(0, 0);
      });
      render();
    </script>
  </body>
</html>
