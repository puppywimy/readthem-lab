<!doctype html>
<!--
  Readthem Lab 디자인 가이드 (홈, 도서 검색, 도서 상세, 마이페이지, 관리자, 회원가입 약관)

  - 새 디자인을 보여 주는 정적 프로토타입입니다. API는 연결되어 있지 않고, front/에는 아직 반영되지 않았습니다.
  - 맨 위 검은 막대는 시안 이동용 패널이며 실제 서비스에는 넣지 않습니다.
-->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Readthem Lab 디자인 시안</title>
    <script>
      // layout.tsx 의 themeScript 와 동일
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("readthem-theme");
          const theme =
            storedTheme === "light" || storedTheme === "dark"
              ? storedTheme
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <style>
[data-theme=light] .home-a { color-scheme: light; }
[data-theme=dark] .home-a { color-scheme: dark; }
@keyframes home-drift { to { transform: translateY(calc(-50% - 7px)); } }
@keyframes home-swap { from { opacity: 0; transform: translateY(10px); } }

.home-a {
  --bg: light-dark(#fbfcfd, #0f1115);
  --surface: light-dark(#e9ebef, #191c22);
  --ink: light-dark(#14161a, #eef0f3);
  --muted: light-dark(#596070, #a0a7b3);
  --line: light-dark(#d5d9e0, #2a2e37);
  --accent: light-dark(#1f3fd6, #8a9dff);
  --on-accent: light-dark(#f7f8ff, #0f1115);
  --feature: light-dark(#1f3fd6, #2a3a8f);
  --on-feature: #f7f8ff;
  --gutter: clamp(16px, 4vw, 56px);
  --ease: cubic-bezier(.16, 1, .3, 1);
  background: var(--bg);
  color: var(--ink);
  font: 400 16px/1.6 "Pretendard Variable", Pretendard, system-ui, sans-serif;
  word-break: keep-all;
  -webkit-font-smoothing: antialiased;

  * { box-sizing: border-box; margin: 0; }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1400px; margin-inline: auto; padding-inline: var(--gutter); }
  /* globals.css의 제목 테이프 장식을 끈다 */
  h1, h2 { display: block; position: static; width: auto; }
  h1::before, h2::before { content: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* 내비게이션 */
  .nav { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .nav .wrap { height: 68px; display: flex; align-items: center; gap: 28px; }
  .logo { font-weight: 800; font-size: 1.15rem; letter-spacing: -.03em; white-space: nowrap; }
  .logo em { font-style: normal; color: var(--accent); }
  .links { display: flex; gap: 22px; color: var(--muted); font-weight: 500; white-space: nowrap; }
  .links a:hover, .links button:hover { color: var(--ink); }
  .links button { padding: 0; font-weight: 500; }
  .nav-end { margin-left: auto; display: flex; align-items: center; gap: 10px; }
  .icon-btn { width: 42px; height: 42px; border-radius: 999px; display: grid; place-items: center; transition: background .2s; }
  .icon-btn:hover { background: var(--surface); }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding-inline: 18px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; white-space: nowrap; transition: transform .2s var(--ease), filter .2s; }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(1px) scale(.98); }
  .btn.line { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn.line:hover { background: var(--surface); filter: none; }

  /* 표지 */
  .cover { position: relative; display: block; aspect-ratio: 2/3; border-radius: 4px; overflow: hidden; background: hsl(var(--h) 38% 28%); color: #f4f5f2; box-shadow: 0 10px 24px -14px color-mix(in srgb, var(--ink) 55%, transparent); }
  .cover > span { position: absolute; inset: 12px; font-weight: 700; line-height: 1.3; font-size: .92rem; }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* 히어로 */
  .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: min(calc(100dvh - 104px), 760px); min-height: 560px; max-width: 1400px; margin-inline: auto; overflow: hidden; }
  .hero-text { padding: clamp(48px, 9vh, 88px) var(--gutter) 40px; align-self: center; }
  h1 { font-size: clamp(2.5rem, 5vw, 4.6rem); line-height: 1.12; letter-spacing: -.03em; font-weight: 800; }
  .lede { margin-top: 20px; font-size: 1.13rem; color: var(--muted); max-width: 30em; }
  .trend-link { display: inline-flex; align-items: flex-start; gap: 1px; padding: 0; font-style: italic; font-weight: 400; }
  .trend-link span { margin-top: .3em; }
  .trend-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .search { margin-top: 32px; max-width: 520px; }
  .search label { display: block; font-weight: 600; font-size: .93rem; margin-bottom: 8px; }
  .search div { display: flex; gap: 6px; padding: 6px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--bg); transition: box-shadow .2s; }
  .search div:focus-within { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; padding-inline: 14px; }
  .search input::placeholder { color: var(--muted); }
  .wall { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-right: var(--gutter); overflow: hidden; mask-image: linear-gradient(transparent, #000 7%, #000 93%, transparent); }
  .col { display: grid; gap: 14px; align-content: start; animation: home-drift 70s linear infinite; }
  .col:nth-child(2) { animation-direction: reverse; animation-duration: 85s; }
  .col:nth-child(3) { animation-duration: 60s; }
  .wall:hover .col { animation-play-state: paused; }
  .col .cover { transition: transform .35s var(--ease); }
  .col .cover:hover { transform: scale(1.03); }

  /* 순위 */
  section { padding-block: clamp(56px, 8vw, 104px); scroll-margin-top: 40px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px 32px; }
  .tab { font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 800; letter-spacing: -.03em; color: var(--muted); padding: 0; transition: color .2s; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected=true] { color: var(--ink); text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 4px; text-underline-offset: 10px; }
  .panel { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 88px); margin-top: 48px; animation: home-swap .5s var(--ease); }
  .top { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr); gap: 24px; align-items: end; align-self: start; }
  .top .num { font-size: clamp(4.5rem, 9vw, 7.5rem); font-weight: 800; line-height: .9; letter-spacing: -.06em; color: var(--accent); }
  .top h3 { font-size: 1.5rem; font-weight: 700; line-height: 1.25; letter-spacing: -.025em; margin-top: 12px; }
  .meta { color: var(--muted); font-size: .93rem; }
  .metric { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .metric > span:first-child { color: var(--accent); }
  .rows { list-style: none; padding: 0; }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows a { display: grid; grid-template-columns: 2.2rem 48px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding-block: 12px; transition: transform .25s var(--ease); }
  .rows a:hover { transform: translateX(6px); }
  .rows b { font-size: 1.3rem; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .rows .title { font-weight: 600; line-height: 1.35; }
  .rows .cover > span { display: none; }

  /* 리뷰 */
  h2 { font-size: clamp(1.6rem, 3vw, 2.5rem); font-weight: 800; letter-spacing: -.035em; line-height: 1.2; }
  .reviews { display: grid; grid-template-columns: 7fr 5fr; gap: 16px; margin-top: 36px; }
  .rv { border-radius: 16px; padding: clamp(20px, 2.5vw, 32px); display: flex; flex-direction: column; background: var(--surface); }
  .rv:first-child { grid-row: span 2; background: var(--feature); color: var(--on-feature); --muted: var(--on-feature); }
  .rv q { quotes: none; font-weight: 600; line-height: 1.5; font-size: 1.1rem; }
  .rv:first-child q { font-size: clamp(1.5rem, 2.8vw, 2.4rem); line-height: 1.32; letter-spacing: -.03em; font-weight: 700; }
  .rv-foot { margin-top: auto; padding-top: 24px; display: flex; align-items: center; gap: 14px; }
  .rv-foot .cover { width: 44px; flex: none; box-shadow: none; }
  .rv-foot .cover > span { display: none; }
  .rv-foot div { min-width: 0; flex: 1; line-height: 1.35; }
  .rv-foot strong { display: block; }
  .rv-foot small { font-size: .87rem; color: var(--muted); }
  .rating { display: inline-flex; align-items: center; gap: 3px; margin-left: 8px; }
  .widget { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(32px, 6vw, 88px); align-items: center; }
  .widget-section { padding-block: clamp(96px, 13vw, 184px); background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  .widget .btn { margin-top: 24px; }
  .widget img { width: 100%; border-radius: 16px; }
  .like { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 6px 10px; border-radius: 999px; transition: transform .2s var(--ease); }
  .like:active { transform: scale(.92); }
  .rv:first-child .like:focus-visible { outline-color: var(--on-feature); }

  /* 최근 */
  .head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .arrows { display: flex; gap: 4px; }
  .arrows .icon-btn { border: 1px solid var(--line); }
  .track { display: grid; grid-auto-flow: column; grid-auto-columns: clamp(132px, 14vw, 176px); gap: 20px; overflow-x: auto; scroll-snap-type: x proximity; margin-top: 32px; padding-bottom: 12px; scrollbar-width: none; }
  .track > a { scroll-snap-align: start; display: block; }
  .track .cover { transition: transform .3s var(--ease); }
  .track > a:hover .cover { transform: translateY(-6px); }
  .track h3 { font-size: .98rem; font-weight: 600; line-height: 1.35; margin-top: 12px; }

  .foot { border-top: 1px solid var(--line); padding-block: 28px; color: var(--muted); font-size: .93rem; }
  .foot .wrap { display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }

  .reveal { opacity: 0; transform: translateY(18px); transition: opacity .7s var(--ease), transform .7s var(--ease); }
  .reveal.in { opacity: 1; transform: none; }

  @media (max-width: 860px) {
    .long { display: none; }
    .nav .wrap { height: auto; flex-wrap: wrap; gap: 8px 12px; padding-block: 10px; }
    .links { order: 3; width: 100%; gap: 18px; font-size: .93rem; }
    section { scroll-margin-top: 88px; }
    .tabs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 16px; scrollbar-width: none; }
    .tab { flex: none; white-space: nowrap; }
    .hero { grid-template-columns: minmax(0, 1fr); height: auto; min-height: 0; }
    .hero-text { padding-top: 40px; padding-bottom: 28px; }
    .wall { height: 280px; padding-inline: var(--gutter); gap: 10px; }
    .panel, .reviews, .widget { grid-template-columns: minmax(0, 1fr); }
    .rv:first-child { grid-row: auto; }
    .top { grid-template-columns: 130px minmax(0, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1; transform: none; }
  }
}
body { margin: 0; }
[data-theme=dark] .theme-light-only, [data-theme=light] .theme-dark-only { display: none; }
@keyframes sk-pulse { 50% { opacity: .45; } }

.home-a {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;

  > * { width: 100%; } /* margin-inline:auto인 .wrap이 flex 안에서 내용 폭으로 줄지 않게 한다 */
  textarea, select { font: inherit; color: inherit; }
  .i { width: 18px; height: 18px; flex: none; }
  .i.h-3 { width: 12px; height: 12px; }
  .i.h-5 { width: 20px; height: 20px; }
  .page { flex: 1; width: 100%; }
  .foot { margin-top: auto; }
  .swap { animation: home-swap .5s var(--ease); }

  /* 시안 이동 패널: 실제 서비스에는 포함하지 않는다 */
  .dev-bar { position: sticky; top: 0; z-index: 20; height: 36px; flex: none; display: flex; align-items: center; gap: 18px; padding-inline: var(--gutter); background: var(--ink); color: var(--bg); font-size: .85rem; white-space: nowrap; overflow-x: auto; scrollbar-width: none; }
  .dev-bar strong { font-weight: 700; }
  .dev-bar a { opacity: .75; padding-block: 4px; }
  .dev-bar a:hover, .dev-bar a[aria-current] { opacity: 1; }
  .dev-bar a[aria-current] { font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
  .dev-bar :focus-visible { outline-color: var(--bg); }
  .dev-end { margin-left: auto; display: flex; gap: 14px; }
  .dev-bar label { display: flex; align-items: center; gap: 6px; }
  .dev-bar select { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 999px; padding: 0 6px; }
  .dev-bar option { color: var(--ink); background: var(--bg); }
  .nav { top: 36px; }
  .links a[aria-current] { color: var(--ink); }
  .links a.nav-admin, .links a.nav-admin:hover { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-weight: 700; }
  section { scroll-margin-top: 112px; }

  /* 공통 */
  .page-title { font-size: clamp(1.6rem, 3vw, 2.5rem); line-height: 1.2; letter-spacing: -.035em; }
  .band { background: color-mix(in srgb, var(--accent) 8%, var(--bg)); }
  .state { padding-block: 40px; color: var(--muted); }
  .state strong { display: block; color: var(--ink); font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
  .state .btn { margin-top: 18px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; }
  .tags li { padding: 2px 10px; border-radius: 999px; background: var(--surface); font-size: .85rem; }
  .text-btn { padding: 4px 10px; border-radius: 999px; font-size: .9rem; font-weight: 600; color: var(--muted); white-space: nowrap; transition: background .2s, transform .2s var(--ease); }
  .text-btn:hover { color: var(--ink); background: var(--surface); }
  .text-btn:active { transform: scale(.96); }
  .avatar { position: relative; display: grid; place-items: center; flex: none; width: var(--s, 44px); height: var(--s, 44px); border-radius: 999px; overflow: hidden; background: var(--surface); font-weight: 700; }
  .avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .sk { display: block; border-radius: 8px; background: var(--surface); animation: sk-pulse 1.4s ease-in-out infinite; }
  .sk.cover-sk { aspect-ratio: 2/3; border-radius: 4px; }
  .sk.line { height: 1em; margin-top: 12px; }

  /* 도서 검색 */
  .split { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: clamp(32px, 6vw, 88px); align-items: start; padding-block: clamp(40px, 6vw, 72px); }
  .sticky-col { position: sticky; top: 136px; }
  .split .search { margin-top: 20px; }
  .search-col { max-height: calc(100dvh - 160px); overflow-y: auto; padding: 4px; margin: -4px; scrollbar-width: thin; }
  .filters { margin-top: 24px; }
  .filters summary { display: none; }
  .filter-group { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
  .filter-group legend { padding: 0; margin-bottom: 8px; font-size: .93rem; font-weight: 600; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { position: relative; cursor: pointer; }
  .chip input { position: absolute; opacity: 0; }
  .chip span { display: block; padding: 4px 12px; border: 1.5px solid var(--line); border-radius: 999px; font-size: .9rem; white-space: nowrap; transition: background .2s, color .2s; }
  .chip:hover span { background: var(--surface); }
  .chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .filters .text-btn { margin-left: -10px; }
  .count { margin-top: 6px; color: var(--muted); }
  .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 32px 22px; }
  .book-grid .cover { transition: transform .3s var(--ease); }
  .book-grid a:hover .cover { transform: translateY(-6px); }
  .book-grid h2 { font-size: .98rem; font-weight: 600; line-height: 1.35; letter-spacing: 0; margin-top: 12px; }
  .book-grid .stats { display: flex; gap: 12px; margin-top: 4px; font-size: .9rem; }
  .end { padding-block: 40px 8px; color: var(--muted); font-size: .93rem; }

  /* 도서 상세 */
  .book-hero { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: clamp(32px, 6vw, 88px); align-items: center; padding-block: clamp(40px, 6vw, 72px); }
  .book-hero h1 { font-size: clamp(2rem, 4vw, 3.4rem); }
  .book-hero .desc { margin-top: 18px; max-width: 38em; }
  .book-hero .tags { margin-top: 18px; }
  .book-hero .tags li { background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
  .book-hero .btn { margin-top: 26px; }
  .book-body { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: clamp(32px, 6vw, 88px); align-items: start; }
  .score { font-size: clamp(4.5rem, 9vw, 7.5rem); font-weight: 800; line-height: .9; letter-spacing: -.06em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .hist { margin-block: 24px; display: grid; gap: 6px; font-size: .9rem; font-variant-numeric: tabular-nums; }
  .hist div { display: grid; grid-template-columns: 1rem minmax(0, 1fr); gap: 10px; align-items: center; }
  .hist i { display: block; height: 8px; border-radius: 999px; background: var(--accent); }
  .feature-review { border-radius: 16px; padding: clamp(20px, 2.5vw, 32px); border: 1px solid var(--line); }
  .rv-list { list-style: none; padding: 0; margin-top: 12px; }
  .sort { display: flex; justify-content: flex-end; gap: 16px; margin-top: 20px; padding-inline: calc(clamp(20px, 2.5vw, 32px) + 1px); }
  .sort + .rv-list { margin-top: 4px; }
  /* 태그 pill과 구분되도록 배경 없이 글자와 밑줄로만 표시한다 (홈 순위 탭과 같은 방식) */
  .sort .text-btn, .sort .text-btn:hover { padding: 4px 0; border-radius: 0; background: none; }
  .sort [aria-pressed=true] { color: var(--ink); font-weight: 700; text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 6px; }
  .rv-list li + li { border-top: 1px solid var(--line); }
  .rv-row { padding: 22px calc(clamp(20px, 2.5vw, 32px) + 1px); } /* 베스트 리뷰의 테두리 1px만큼 더해 내용 세로선을 맞춘다 */
  .rv-who strong .badge { margin-left: 6px; font-size: .78rem; font-weight: 600; vertical-align: 1px; }
  .rv-row q, .feature-review q { quotes: none; display: block; line-height: 1.6; max-width: 62ch; }
  .rv-who { display: flex; align-items: center; gap: 10px; }
  .rv-who > div { min-width: 0; flex: 1; line-height: 1.35; }
  .rv-who strong { display: block; font-weight: 600; }
  .rv-who small { font-size: .87rem; color: var(--muted); }
  .rv-row q, .feature-review q { margin-top: 14px; }
  .rv-row .tags, .feature-review .tags { margin-top: 12px; }

  /* 내 서재 */
  .me { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: clamp(20px, 3vw, 36px); align-items: center; padding-block: clamp(36px, 5vw, 56px); }
  .me a.gh { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); margin-top: 4px; }
  .me a.gh:hover { color: var(--ink); }
  .me-stats { display: flex; gap: clamp(24px, 4vw, 56px); margin: 0; }
  .me-stats dd { margin: 0; order: -1; font-size: clamp(1.8rem, 3.4vw, 3rem); font-weight: 800; letter-spacing: -.04em; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .me-stats div { display: flex; flex-direction: column; }
  .me-stats dt { color: var(--muted); font-size: .93rem; }
  .tab-body { margin-top: 32px; }

                    <div class="row-actions"><button class="text-btn" data-act="write-review" data-edit="1">수정</button><button class="text-btn" data-act="confirm" data-msg="리뷰를 삭제하시겠습니까?" data-done="리뷰를 삭제했습니다.">삭제</button></div></li>`;
                }).join("")}</ul>`
              : stateMsg("작성한 리뷰가 없습니다.", "읽은 책을 찾아 첫 리뷰를 남겨 보세요.", `<a class="btn" href="#/search">도서 찾기</a>`),
          liked: () =>
            liked.length
              ? `<ul class="rv-list">${liked.map((v) => {
                  const b = HOME_BOOKS[v.b];
                  return `<li class="my-row">${coverLink(b)}<div><h2><a href="${homeHref(b)}">${esc(b.t)}</a></h2><p class="meta">${esc(v.u)}<span class="rating">${icon("star", "h-3")}<span class="sr">별점 </span>${v.r.toFixed(1)}</span></p><q>${esc(v.q)}</q></div><div class="row-actions">${like(v.l, true)}</div></li>`;
                }).join("")}</ul>`
              : stateMsg("좋아요한 리뷰가 없습니다.", "마음에 드는 리뷰에 좋아요를 눌러 모아 보세요."),
          wish: () =>
            wishes.length
              ? `<div class="book-grid">${wishes.map((b) => `<div class="wish-item"><a href="${homeHref(b)}">${homeCover(b)}<h2>${esc(b.t)}</h2><p class="meta">${esc(b.a)}</p></a><button class="text-btn" data-act="wish" data-key="${b.key}">찜 해제</button></div>`).join("")}</div>`
              : stateMsg("보고 싶어요에 담은 책이 없습니다.", "관심 있는 책을 담으면 위젯에도 표시됩니다."),
        };
        const tabs = [["reviews", "작성한 리뷰"], ["liked", "좋아요한 리뷰"], ["wish", "보고 싶어요"]]
          .map(([id, label]) => `<button class="tab" role="tab" data-act="my-tab" data-id="${id}" aria-selected="${id === state.myTab}">${label}</button>`)
          .join("");
        const snippet = `<img src="https://readthem-lab.example/widget/${ME.id}.svg" alt="내 서재 위젯" />`;
        return shell("mypage", `<div class="band"><div class="wrap me">
            ${avatar(ME.id, 96)}
            <div><h1 class="page-title">${ME.name}의 서재</h1><a class="gh" href="https://github.com/${ME.id}" target="_blank" rel="noreferrer">${icon("github")}${ME.id}</a></div>
            <dl class="me-stats">
              <div><dt>작성한 리뷰</dt><dd>${myReviews.length}</dd></div>
              <div><dt>보고 싶어요</dt><dd>${wishes.length}</dd></div>
              <div><dt>내 평균 별점</dt><dd>${empty ? "0.0" : ME.avg.toFixed(1)}</dd></div>
            </dl>
          </div></div>
          <section class="wrap" style="padding-block:clamp(40px,5vw,64px)">
            <div class="tabs" role="tablist">${tabs}</div>
            <div class="tab-body swap" role="tabpanel">${panels[state.myTab]()}</div>
          </section>
          <section class="band"><div class="wrap widget">
            <div>
              <h2>GitHub 프로필에 책장 붙이기</h2>
              <ol class="steps"><li>1. 프로필 저장소의 README.md를 엽니다.</li><li>2. 아래 코드를 복사해 붙여 넣습니다.</li></ol>
              <div class="code"><code>${esc(snippet)}</code><button class="btn" data-act="copy" data-text="${esc(snippet)}">코드 복사</button></div>
            </div>
            <img src="widget-sample.svg" alt="리뷰를 쓰거나 보고 싶어요한 책의 표지가 흐르는 위젯 예시">
          </div></section>
          <div class="wrap account"><button class="text-btn" data-act="confirm" data-msg="정말 탈퇴하시겠습니까? 되돌릴 수 없습니다." data-done="회원 탈퇴가 완료되었습니다.">회원 탈퇴</button></div>`);
      }

      /* ───────── 관리자 ───────── */
      function adminScreen() {
        if (state.auth === "guest")
          return shell("admin", `<div class="wrap gate"><h1 class="page-title">관리자 로그인</h1>
            <form data-form="admin-login">
              <label class="field">아이디<input name="username" required maxlength="30" autocomplete="username"></label>
              <label class="field">비밀번호<input name="password" type="password" required maxlength="30" autocomplete="current-password"></label>
              <button class="btn">로그인</button>
            </form></div>`);
        if (state.auth === "member") return shell("admin", `<div class="wrap">${stateMsg("관리자 권한이 없는 계정입니다.", "관리자 계정으로 다시 로그인해 주세요.", `<a class="btn line" href="#/">홈으로</a>`)}</div>`);
        const empty = state.view === "empty";
        const delBtn = (msg, done, label = "삭제") => `<button class="text-btn" data-act="confirm" data-msg="${msg}" data-done="${done}">${label}</button>`;
        const table = (head, rows) => `<div class="table-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></div>`;
        const panels = {
          members: () =>
            empty ? stateMsg("회원이 없습니다.", "") :
            table(`<th class="num">ID</th><th>아이디</th><th>닉네임</th><th>GitHub</th><th>권한</th><th>상태</th><th>가입일</th><th></th>`,
              MEMBERS.map(([id, username, nick, gh, admin, gone, date]) => `<tr><td class="num">${id}</td><td class="nowrap">${esc(username)}</td><td class="nowrap">${esc(nick)}</td><td class="nowrap">${esc(gh)}</td><td><span class="badge ${admin ? "on" : ""}">${admin ? "관리자" : "일반"}</span></td><td class="nowrap">${gone ? "탈퇴" : "정상"}</td><td class="nowrap">${date}</td><td class="fit">${gone || admin ? "" : delBtn("이 회원을 강제 탈퇴시키겠습니까?", "회원을 강제 탈퇴시켰습니다.", "강제 탈퇴")}</td></tr>`).join("")),
          books: () =>
            empty ? stateMsg("도서가 없습니다.", "") :
            table(`<th>제목</th><th>저자</th><th class="num">평점</th><th class="num">리뷰</th><th class="num">조회</th><th></th>`,
              allBooks().slice(0, 8).map((b) => `<tr><td><span class="cell-book">${homeCover(b, { size: "S" })}${esc(b.t)}</span></td><td class="nowrap">${esc(b.a)}</td><td class="num">${b.r.toFixed(1)}</td><td class="num">${b.n}</td><td class="num">${b.v.toLocaleString()}</td><td class="fit"><button class="text-btn" data-act="edit-book" data-key="${b.key}">수정</button>${delBtn("이 도서를 삭제하시겠습니까?", "도서를 삭제했습니다.")}</td></tr>`).join("")),
          reviews: () =>
            empty ? stateMsg("리뷰가 없습니다.", "") :
            table(`<th>도서</th><th>작성자</th><th class="num">별점</th><th>내용</th><th class="num">좋아요</th><th></th>`,
              [...HOME_REVIEWS.map((v) => ({ ...v, b: HOME_BOOKS[v.b] })), { b: HOME_BOOKS.ca, u: null, r: 3, l: 2, q: "기대보다 사례가 적었습니다." }]
                .map((v) => `<tr><td><span class="cell-book">${homeCover(v.b, { size: "S" })}${esc(v.b.t)}</span></td><td class="nowrap">${v.u ? esc(v.u) : "탈퇴한 사용자"}</td><td class="num">${v.r.toFixed(1)}</td><td class="clip">${esc(v.q)}</td><td class="num">${v.l}</td><td class="fit">${delBtn("이 리뷰를 삭제하시겠습니까?", "리뷰를 삭제했습니다.")}</td></tr>`).join("")),
        };
        const tabs = [["members", "회원 관리"], ["books", "도서 관리"], ["reviews", "리뷰 관리"]]
          .map(([id, label]) => `<button class="tab" role="tab" data-act="admin-tab" data-id="${id}" aria-selected="${id === state.adminTab}">${label}</button>`)
          .join("");
        return shell("admin", `<div class="wrap admin"><h1 class="page-title">관리자 페이지</h1>
          <div class="tabs" role="tablist">${tabs}</div>
          ${state.view === "loading" ? `<div aria-busy="true" style="margin-top:28px">${"<span class='sk line' style='height:44px'></span>".repeat(6)}</div>` : `<div class="swap" role="tabpanel">${panels[state.adminTab]()}${empty ? "" : `<nav class="pager" aria-label="페이지"><button aria-current="page">1</button><button>2</button><button>3</button></nav>`}</div>`}
        </div>`);
      }

      /* ───────── 회원가입(약관) ───────── */
      const TERMS = [
        ["서비스 이용약관", "Readthem Lab은 GitHub 계정으로 도서 리뷰를 작성하고 공유하는 서비스입니다. 회원이 작성한 리뷰는 다른 이용자에게 공개되며, 회원은 언제든 내 서재에서 탈퇴할 수 있습니다."],
        ["개인정보 수집 및 이용", "수집 항목: GitHub 아이디, 닉네임, 프로필 이미지. 이용 목적: 회원 식별, 리뷰 작성자 표시, 내 서재 위젯 제공. 보유 기간: 회원 탈퇴 시까지."],
      ];
      function joinScreen() {
        const items = TERMS.map(([title, body], i) => `<div class="term">
          <div class="term-head">
            <label class="check"><input type="checkbox" data-term required>[필수] ${title}</label>
            <details><summary aria-label="${title} 내용 보기">보기</summary></details>
          </div>
          <p class="term-body" id="term-${i}">${body}</p>
        </div>`).join("");
        return shell("join", `<div class="hero join-hero">
          <div class="join-text">
            <h1>약관에 동의하면<br>바로 시작할 수 있어요</h1>
            <div class="gh-account">${avatar(ME.id)}<div><strong>${ME.id}</strong><small>GitHub 계정으로 가입합니다</small></div></div>
            <form class="terms" data-form="join">
              <label class="check all"><input type="checkbox" id="agree-all">전체 동의</label>
              ${items}
              <div class="join-actions">
                <button class="btn" id="join-submit" disabled>동의하고 시작하기</button>
                <a class="text-btn" href="#/">취소</a>
              </div>
            </form>
          </div>
          <div class="join-side"><div class="wall" aria-hidden="true">${coverWall()}</div></div>
        </div>`);
      }

      /* ───────── 상단 패널과 라우팅 ───────── */
      const SCREENS = {
        "": ["홈", homeScreen],
        search: ["도서 검색", searchScreen],
        book: ["도서 상세", bookScreen],
        mypage: ["마이페이지", mypageScreen],
        admin: ["관리자", adminScreen],
        join: ["회원가입", joinScreen],
      };
      const NEEDS_AUTH = { mypage: "member", admin: "admin" };
      const currentRoute = () => {
        const [path, query] = location.hash.replace(/^#\/?/, "").split("?");
        return { path: SCREENS[path] ? path : "", params: new URLSearchParams(query) };
      };
      function devBar(path) {
        const options = (list, value) => list.map(([v, label]) => `<option value="${v}" ${v === value ? "selected" : ""}>${label}</option>`).join("");
        const noStates = path === "" || path === "join";
        return `<nav class="dev-bar" aria-label="디자인 시안 화면 목록">
          <strong>디자인 시안</strong>
          ${Object.entries(SCREENS).map(([key, [label]]) => `<a href="#/${key}" data-need="${NEEDS_AUTH[key] ?? ""}" ${key === path ? 'aria-current="page"' : ""}>${label}</a>`).join("")}
          <div class="dev-end">
            ${noStates ? "" : `<label>화면 상태<select data-panel="view">${options([["default", "기본"], ["empty", "비어 있음"], ["loading", "로딩"]], state.view)}</select></label>`}
            <label>로그인<select data-panel="auth">${options([["guest", "비로그인"], ["member", "회원"], ["admin", "관리자"]], state.auth)}</select></label>
          </div>
        </nav>`;
      }
      function render() {
        const { path, params } = currentRoute();
        $("#app").innerHTML = `${devBar(path)}${SCREENS[path][1](params)}<dialog id="dlg"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div>`;
        if (path === "") {
          initHome();
          const target = params.get("to");
          if (target) document.getElementById(target)?.scrollIntoView();
        }
      }

      /* ───────── 대화상자와 이벤트 ───────── */
      let toastTimer;
      function showToast(message) {
        const toast = $("#toast");
        toast.textContent = message;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 2200);
      }
      function openDialog(html) {
        const dialog = $("#dlg");
        dialog.innerHTML = `<div class="dlg">${html}</div>`;
        dialog.showModal();
      }
      const dialogActions = (label) => `<div class="dlg-actions"><button type="button" class="btn line" data-act="close">취소</button><button class="btn">${label}</button></div>`;
      const askLogin = () => openDialog(`<h2>로그인이 필요합니다</h2><p>GitHub 계정으로 로그인하면 리뷰를 쓰고 책을 찜할 수 있습니다.</p><div class="dlg-actions"><button type="button" class="btn line" data-act="close">닫기</button>${loginButton}</div>`);

      const ACTIONS = {
        "home-tab"(el) {
          state.homeTab = el.textContent;
          document.querySelectorAll(".home-a .tab").forEach((tab) => tab.setAttribute("aria-selected", tab === el));
          $("#home-panel").innerHTML = homeRankPanel(state.homeTab);
        },
        "home-top"() { window.scrollTo({ top: 0, behavior: "smooth" }); },
        "home-jump"(el) { document.getElementById(el.dataset.target).scrollIntoView({ behavior: "smooth" }); },
        "home-scroll"(el) { $("#home-track").scrollBy({ left: Number(el.dataset.dir) * 400, behavior: "smooth" }); },
        theme() {
          const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          try { localStorage.setItem("readthem-theme", next); } catch {}
        },
        login() { $("#dlg").open && $("#dlg").close(); location.hash = "#/join"; },
        logout() { state.auth = "guest"; render(); showToast("로그아웃되었습니다."); },
        like(el) {
          if (!isLogin()) return askLogin();
          const liked = el.getAttribute("aria-pressed") !== "true";
          const count = Number(el.querySelector("span").textContent) + (liked ? 1 : -1);
          el.outerHTML = like(count, liked);
        },
        wish(el) {
          if (!isLogin()) return askLogin();
          const { key } = el.dataset;
          state.wished.has(key) ? state.wished.delete(key) : state.wished.add(key);
          render();
          showToast(state.wished.has(key) ? "보고 싶어요에 담았습니다." : "보고 싶어요를 취소했습니다.");
        },
        "review-sort"(el) {
          // 다시 그리지 않고 행만 옮겨 좋아요 상태를 유지한다
          state.reviewSort = el.dataset.id;
          document.querySelectorAll("[data-act=review-sort]").forEach((b) => b.setAttribute("aria-pressed", b === el));
          const list = $("#review-list");
          const row = (li) => ({ li, d: li.dataset.date, l: Number(li.querySelector(".like span").textContent) });
          [...list.children].map(row).sort(REVIEW_SORT[state.reviewSort]).forEach(({ li }) => list.append(li));
        },
        "my-tab"(el) { state.myTab = el.dataset.id; render(); },
        "admin-tab"(el) { state.adminTab = el.dataset.id; render(); },
        close() { $("#dlg").close(); },
        copy(el) {
          navigator.clipboard?.writeText(el.dataset.text).catch(() => {});
          el.textContent = "복사 완료";
          setTimeout(() => (el.textContent = "코드 복사"), 1600);
        },
        confirm(el) {
          openDialog(`<form data-form="done" data-done="${esc(el.dataset.done)}"><h2>${esc(el.dataset.msg)}</h2>${dialogActions("확인")}</form>`);
        },
        "write-review"(el) {
          if (!isLogin()) return askLogin();
          const edit = !!el.dataset.edit;
          openDialog(`<form data-form="done" data-done="${edit ? "리뷰를 수정했습니다." : "리뷰를 등록했습니다."}" class="dlg" style="padding:0">
            <h2>${edit ? "리뷰 수정" : "리뷰 쓰기"}</h2>
            <label class="field"><span class="field-head">별점<output id="rating-out">4.5</output></span><input type="range" min="0.5" max="5" step="0.5" value="4.5" data-rating></label>
            <label class="field"><span class="field-head">리뷰<small><span id="count-out">0</span>/500</small></span><textarea required maxlength="500" data-count></textarea></label>
            <label class="field">태그<input maxlength="100" aria-describedby="tag-help"><small id="tag-help">쉼표로 구분해 입력합니다.</small></label>
            ${dialogActions(edit ? "수정 완료" : "등록")}
          </form>`);
        },
        "edit-book"(el) {
          const b = HOME_BOOKS[el.dataset.key];
          const [publisher, , desc] = BOOK_META[b.key];
          const field = (label, value) => `<label class="field">${label}<input value="${esc(value)}"></label>`;
          openDialog(`<form data-form="done" data-done="도서 정보를 수정했습니다." class="dlg" style="padding:0">
            <h2>도서 수정</h2>
            ${field("제목", b.t)}
            <label class="field">설명<textarea>${esc(desc)}</textarea></label>
            ${field("저자 (쉼표로 구분)", b.a)}
            ${field("출판사", publisher)}
            ${field("표지 이미지 URL", `https://covers.openlibrary.org/b/isbn/${b.i}-L.jpg`)}
            ${dialogActions("저장")}
          </form>`);
        },
      };

      document.addEventListener("click", (e) => {
        const need = e.target.closest("[data-need]");
        if (need?.dataset.need && !isLogin()) state.auth = need.dataset.need;
        if (need?.dataset.need === "admin") state.auth = "admin";
        if (e.target.id === "dlg") return e.target.close();
        const el = e.target.closest("[data-act]");
        if (!el) return;
        if (el.matches("a[href='#']")) e.preventDefault();
        ACTIONS[el.dataset.act](el);
      });
      document.addEventListener("submit", (e) => {
        const form = e.target;
        e.preventDefault();
        if (form.matches("[data-search-form]")) {
          const term = form.querySelector("input").value.trim();
          state.searchTerm = term;
          location.hash = `#/search?term=${encodeURIComponent(term)}`;
        } else if (form.dataset.form === "admin-login") {
          state.auth = "admin";
          render();
        } else if (form.dataset.form === "join") {
          state.auth = "member";
          location.hash = "#/";
          showToast("가입이 완료되었습니다.");
        } else {
          $("#dlg").close();
          showToast(form.dataset.done);
        }
      });
      document.addEventListener("change", (e) => {
        const panel = e.target.dataset.panel;
        if (panel) {
          state[panel] = e.target.value;
          return render();
        }
        const all = $("#agree-all");
        if (!all) return;
        const terms = [...document.querySelectorAll("[data-term]")];
        if (e.target === all) terms.forEach((t) => (t.checked = all.checked));
        all.checked = terms.every((t) => t.checked);
        $("#join-submit").disabled = !all.checked;
      });
      document.addEventListener("input", (e) => {
        if (e.target.matches("[data-rating]")) $("#rating-out").textContent = Number(e.target.value).toFixed(1);
        if (e.target.matches("[data-count]")) $("#count-out").textContent = e.target.value.length;
      });
      window.addEventListener("hashchange", () => {
        render();
        if (!location.hash.includes("to=")) window.scrollTo(0, 0);
      });
      render();
    </script>
  </body>
</html>
